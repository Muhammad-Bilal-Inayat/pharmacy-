    <!-- Fetch property descriptor guard to avoid 'Cannot set property fetch of #<Window> which has only a getter' -->
    <script>
      (function() {
        // 1. Immediate early error suppression for fetch property getter errors
        var suppressFetchError = function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) ? String(e.message || e.error.message) : '';
          if (
            msg.indexOf('Cannot set property fetch') !== -1 ||
            msg.indexOf('fetch of #<Window>') !== -1 ||
            msg.indexOf('which has only a getter') !== -1
          ) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        };

        try {
          window.addEventListener('error', suppressFetchError, true);
          window.addEventListener('unhandledrejection', function(e) {
            var reason = (e && e.reason) ? String(e.reason.message || e.reason) : '';
            if (
              reason.indexOf('Cannot set property fetch') !== -1 ||
              reason.indexOf('fetch of #<Window>') !== -1 ||
              reason.indexOf('which has only a getter') !== -1
            ) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          }, true);
        } catch (err) {}

        // 2. Install getter and setter on Window.prototype, window, and globalThis
        try {
          var _rawFetch = (typeof window !== 'undefined' && window.fetch) ? window.fetch.bind(window) : undefined;
          var _currentFetch = _rawFetch;

          function setupTarget(target) {
            if (!target) return;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return _currentFetch || _rawFetch;
                },
                set: function(val) {
                  _currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (err) {
              try {
                // Fallback: make it a simple writable value
                target.fetch = _currentFetch || _rawFetch;
              } catch(e) {}
            }
          }

          if (typeof window !== 'undefined') {
            if (window.Window && window.Window.prototype) {
              setupTarget(window.Window.prototype);
            }
            setupTarget(window);
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            setupTarget(globalThis);
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('vyapar_system_app_settings_v2');
          if (raw) {
            var settings = JSON.parse(raw);
            var theme = settings && settings.general && settings.general.theme;
            var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
              document.documentElement.classList.add('dark');
            } else if (theme === 'light') {
              document.documentElement.classList.remove('dark');
            }
          }
        } catch(e) {}
      })();
    </script>
    <style>
      html, body, #root {
        min-height: 100vh;

      .emergency-btn {
        margin-top: 14px;

        font-weight: bold;
        font-size: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .emergency-btn:hover {
        opacity: 0.9;
      }

  <body>
    <div id="root"></div>

    <!-- Failsafe emergency helper script -->
    <script>
      window.__mbi_emergency_reset = function() {
        if (confirm('Reset application local storage cache and reload? Your cloud data is safe.')) {
          try {
            localStorage.clear();
            sessionStorage.clear();
            if (window.indexedDB) {
              indexedDB.deleteDatabase('pharma-manager-db');
              indexedDB.deleteDatabase('MbiInventraOfflineDB');
            }
          } catch(e) {
            console.warn(e);
          }
          window.location.reload();
        }
      };
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
